<!DOCTYPE html>
<html>
<head>
  <title>Pembayaran</title>
</head>
<body>

<h2>Pembayaran Tiket</h2>

<p id="info"></p>
<img src="qrisdanus.jpeg" width="200"><br><br>

<input type="file" id="bukti" accept="image/*"><br><br>

<button onclick="kirim()">Saya Sudah Bayar</button>

<script>
// ambil data dari halaman sebelumnya
const params = new URLSearchParams(window.location.search);
const jenis = params.get("jenis");
const nama = localStorage.getItem("nama");
const wa = localStorage.getItem("wa");
const nimNip = localStorage.getItem("nimNip");

// tampilkan info
document.getElementById("info").innerText =
  "Nama: " + nama + " | Tiket: " + jenis;

// fungsi utama
function kirim() {
  const fileInput = document.getElementById("bukti");
  const file = fileInput.files[0];

  // cek file dulu
  if (!file) {
    alert("Upload bukti dulu!")
    return;
  }

  // cek ukuran max 1MB
  if (file.size > 10 * 1024 * 1024) {
    alert("File maksimal 10MB!");
    return;
  }
  
  const reader = new FileReader();

  reader.onload = function() {
    const base64 = reader.result.split(",")[1];

    const kode = "TIKET-" + Date.now();
    const tanggal = new Date().toLocaleDateString();

    const data = {
      nama: nama,
      wa: wa,
      nimNip: nimNip,
      jenis: jenis,
      kode: kode,        
      file: base64,
      fileName: file.name,
      fileType: file.type,
    };

    fetch("https://script.google.com/macros/s/AKfycbx52WqQFMCsxqUa3Y2oy6moGLRy1id-Uk9WHBiqeBWgPNQ9vVGQckvueAAJWcwo_ctN/exec", {
      method: "POST",    
      mode: "no-cors", 
      body: JSON.stringify(data)
})
.then(() => {
// simpan untuk eticket
       localStorage.setItem("nama", nama);
       localStorage.setItem("wa", wa);
       localStorage.setItem("nimNip", nimNip);
       localStorage.setItem("jenis", jenis);
       localStorage.setItem("kode", kode);
       localStorage.setItem("tanggal", tanggal);

// redirect ke halaman tiket
      window.location.href = "eticket.html";
})
    .catch(err => {
      console.error("ERROR:", err);
      alert("Error kirim data!");
    });

  };

  reader.readAsDataURL(file);
}
</script>

</body>
</html>
